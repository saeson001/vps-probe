<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2a3038;
  --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --acc:#58a6ff; --acc2:#a371f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;padding:20px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.live{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.15)}
.spacer{flex:1}
.btn{background:var(--acc);color:#06111f;border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;transition:.18s;position:relative;overflow:hidden}
.card:hover{border-color:#3d444d;transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.35)}
.card.off{opacity:.55}
.chd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.st{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.st.on{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.18)}
.st.off{background:var(--bad);box-shadow:0 0 0 3px rgba(248,81,73,.18)}
.nm{font-size:15px;font-weight:600;text-decoration:none;color:var(--fg);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.nm:hover{color:var(--acc);text-decoration:underline}
.tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px;white-space:nowrap}
.os{font-size:11px;color:var(--dim);margin-bottom:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.row span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#21262d;border-radius:4px;overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px}
.kv{background:var(--card2);border-radius:7px;padding:6px 9px}
.kv b{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.kv em{font-style:normal;font-size:10px;color:var(--dim)}
.traf{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.big{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.big b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.big em{font-style:normal;font-size:11px;color:var(--dim)}
.nodes{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.node{background:var(--card2);border-radius:7px;padding:7px 9px;font-size:11.5px}
.node .n1{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.node .n1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n1 span{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.nbar{height:4px;background:#21262d;border-radius:3px;overflow:hidden}
.nbar i{display:block;height:100%;border-radius:3px}
.ports{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pt{font-size:10px;padding:2px 7px;border-radius:20px;background:#21262d;color:var(--dim);border:1px solid var(--line)}
.pt.ok{color:var(--ok);border-color:rgba(63,185,80,.35)}
.pt.no{color:var(--bad);border-color:rgba(248,81,73,.35)}
.err{margin-top:9px;font-size:11px;color:var(--warn);background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.25);border-radius:7px;padding:6px 9px;word-break:break-all}
.empty{color:var(--dim);text-align:center;padding:50px 0}
footer{margin-top:20px;color:var(--dim);font-size:11px;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px 22px}
.modal h2{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--acc)}
.field .hint{font-size:11px;color:var(--dim);margin-top:4px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
/* host list */
.hitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hitem .hn{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hitem .hn b{font-size:15px;flex:1}
.hitem .ha{font-size:11px;color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:6px 0;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;position:relative}
.copy{position:absolute;top:5px;right:5px;background:var(--acc);color:#06111f;border:none;border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;font-weight:600}
.copy:hover{filter:brightness(1.1)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <span class="dot" id="live"></span>
  <h1>{{TITLE}}</h1>
  <span class="sub" id="status">加载中…</span>
  <span class="spacer"></span>
  <button class="btn ghost" id="btnManage">管理服务器</button>
  <button class="btn" id="btnAdd">+ 添加服务器</button>
</header>
<div id="grid"><div class="empty">正在加载…</div></div>
<footer>vps-probe · Rust 单文件静态二进制 · 卡片可点击跳转管理页 · 网页内可增删 N 台 VPS</footer>

<!-- 添加/编辑 服务器 弹窗 -->
<div class="ov" id="formOv">
  <div class="modal">
    <h2 id="formTitle">添加服务器</h2>
    <div class="field">
      <label>名称（本机在面板显示的名字，agent 的 --name 须一致）</label>
      <input id="f_name" placeholder="例如 HK-VPS">
    </div>
    <div class="field">
      <label>点击卡片跳转的管理页地址（可选）</label>
      <input id="f_manage" placeholder="http://38.47.108.240:2054/ 或 3x-ui 面板地址">
    </div>
    <div class="field">
      <label>3x-ui 面板地址（填了才能拉流量，留空只显示系统资源）</label>
      <input id="f_purl" placeholder="http://38.47.108.240:2054/webBasePath">
    </div>
    <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>面板账号</label><input id="f_puser" placeholder="admin" value="admin"></div>
      <div class="field"><label>面板密码</label><input id="f_ppass" type="password" placeholder="面板密码"></div>
    </div>
    <div class="field">
      <label>端口探活（逗号分隔，可选）</label>
      <input id="f_ports" placeholder="38.47.108.240:39999,38.47.108.240:30818">
    </div>
    <div class="field">
      <label>流量配额覆盖（字节，可选；面板报 0 时生效）</label>
      <input id="f_quota" placeholder="例如 536870912000 = 500GB">
      <div class="hint">不填则由 3x-ui 面板读取。仅当面板 total 为 0 才用手填值兜底。</div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 管理服务器 弹窗 -->
<div class="ov" id="listOv">
  <div class="modal">
    <h2>服务器列表（<span id="hostCount">0</span> 台）</h2>
    <div class="muted" style="margin-bottom:12px">每台 VPS 仍只需在其机器上跑一次 agent。下面是自动生成的命令，复制后到对应 VPS 执行即可。</div>
    <div id="hostList"></div>
    <div class="modal-actions">
      <button class="btn" id="btnCloseList">关闭</button>
    </div>
  </div>
</div>

<script>
const REFRESH = {{REFRESH}} * 1000;
const KEY = {{KEY}};
const SERVER = location.origin;

function bytes(n){
  if(!n || n<0) n = 0;
  const u=['B','KB','MB','GB','TB','PB'];
  let i=0; let v=Number(n);
  while(v>=1024 && i<u.length-1){v/=1024;i++;}
  return (v>=100?v.toFixed(0):v.toFixed(v>=10?1:2))+' '+u[i];
}
function rate(n){ return bytes(n)+'/s'; }
function uptime(s){
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d>0) return d+'天'+h+'小时';
  if(h>0) return h+'小时'+m+'分';
  return m+'分';
}
function col(p){ return p>=90?'var(--bad)':p>=70?'var(--warn)':'var(--ok)'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function card(v){
  const on = v.online;
  const hasPanel = !!v.panel_configured;
  const usedTotal = v.traffic ? v.traffic.used : 0;
  const quotaTotal = v.traffic ? v.traffic.quota : 0;
  const remain = quotaTotal>0 ? Math.max(0, quotaTotal-usedTotal) : 0;
  const usedPct = quotaTotal>0 ? Math.min(100, usedTotal/quotaTotal*100) : 0;

  let h = '<div class="card'+(on?'':' off')+'">';
  h += '<div class="chd"><span class="st '+(on?'on':'off')+'"></span>';
  if(v.manage_url){
    h += '<a class="nm" href="'+esc(v.manage_url)+'" target="_blank" rel="noopener" title="'+esc(v.manage_url)+'">'+esc(v.name)+'</a>';
  } else {
    h += '<span class="nm">'+esc(v.name)+'</span>';
  }
  h += '<span class="tag">'+(on?'在线':'离线')+'</span>';
  if(hasPanel) h += '<span class="tag">面板</span>';
  h += '</div>';

  if(v.metrics){
    const m = v.metrics;
    h += '<div class="os">'+esc(m.os||'')+(on?' · 已运行 '+uptime(m.uptime_secs||0):'')+'</div>';
    h += '<div class="row"><span>CPU '+(m.cpu_percent||0).toFixed(1)+'%</span><span>'+(m.cores||1)+' 核</span></div>';
    h += '<div class="bar"><i style="width:'+Math.min(100,m.cpu_percent||0)+'%;background:'+col(m.cpu_percent||0)+'"></i></div>';
    const mp = m.mem_percent||0;
    h += '<div class="row"><span>内存 '+mp.toFixed(1)+'%</span><span>'+bytes(m.mem_used)+' / '+bytes(m.mem_total)+'</span></div>';
    h += '<div class="bar"><i style="width:'+Math.min(100,mp)+'%;background:'+col(mp)+'"></i></div>';
    if(m.disk_total>0){
      const dp = m.disk_percent||0;
      h += '<div class="row"><span>磁盘 '+dp.toFixed(0)+'%</span><span>'+bytes(m.disk_used)+' / '+bytes(m.disk_total)+'</span></div>';
      h += '<div class="bar"><i style="width:'+Math.min(100,dp)+'%;background:'+col(dp)+'"></i></div>';
    }
    h += '<div class="grid2">';
    h += '<div class="kv"><b>'+(m.load1||0).toFixed(2)+'</b><em>负载 1m</em></div>';
    h += '<div class="kv"><b>'+rate(m.net_rx_rate||0)+'</b><em>下行</em></div>';
    h += '<div class="kv"><b>'+(m.load5||0).toFixed(2)+'</b><em>负载 5m</em></div>';
    h += '<div class="kv"><b>'+rate(m.net_tx_rate||0)+'</b><em>上行</em></div>';
    h += '</div>';
    if(m.ports && Object.keys(m.ports).length){
      h += '<div class="ports">';
      for(const [p,ok] of Object.entries(m.ports)){
        h += '<span class="pt '+(ok?'ok':'no')+'">'+esc(p)+'</span>';
      }
      h += '</div>';
    }
  } else {
    h += '<div class="os">'+(on?'等待首次上报…':'暂无数据（agent 未运行或密钥不匹配）')+'</div>';
  }

  if(hasPanel){
    h += '<div class="traf">';
    if(v.traffic_error){
      h += '<div class="err">面板读取失败：'+esc(v.traffic_error)+'</div>';
    } else if(v.traffic){
      h += '<div class="row"><span>流量剩余</span><span>已用 '+bytes(usedTotal)+' / '+bytes(quotaTotal)+'</span></div>';
      h += '<div class="big"><b style="color:'+col(usedPct)+'">'+bytes(remain)+'</b><em>剩余</em></div>';
      h += '<div class="bar"><i style="width:'+usedPct+'%;background:'+col(usedPct)+'"></i></div>';
      if(v.traffic.nodes && v.traffic.nodes.length){
        h += '<div class="nodes">';
        for(const n of v.traffic.nodes){
          const nu = (n.up||0)+(n.down||0);
          const np = n.total>0 ? Math.min(100, nu/n.total*100) : 0;
          const nr = n.total>0 ? Math.max(0,n.total-nu) : 0;
          const label = n.client ? (n.node||('端口 '+n.port))+' · '+n.client : (n.node||('端口 '+n.port));
          h += '<div class="node">';
          h += '<div class="n1"><b title="'+esc(label)+'">'+esc(label)+'</b>';
          h += '<span>'+(n.total>0 ? bytes(nr)+' 剩余 / '+bytes(n.total) : bytes(nu))+'</span></div>';
          h += '<div class="nbar"><i style="width:'+np+'%;background:'+col(np)+'"></i></div>';
          h += '</div>';
        }
        h += '</div>';
      }
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

async function tick(){
  const live = document.getElementById('live');
  const st = document.getElementById('status');
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    const d = await r.json();
    live.className = 'dot live';
    const grid = document.getElementById('grid');
    if(!d.vps || !d.vps.length){
      grid.innerHTML = '<div class="empty">还没有上报数据。点右上角「+ 添加服务器」填入信息，再到对应 VPS 跑 agent。</div>';
      st.textContent = '等待 agent 上报';
      return;
    }
    grid.innerHTML = d.vps.map(card).join('');
    const onCount = d.vps.filter(v=>v.online).length;
    st.textContent = onCount+' / '+d.vps.length+' 在线 · '+new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    live.className = 'dot';
    st.textContent = '连接失败：'+e;
  }
}

// ---- 主机管理 ----
function agentCmd(h){
  let c = 'vps-probe agent --server '+SERVER+' --key '+KEY+' --name '+h.name;
  if(h.port_check && h.port_check.length) c += ' --port-check '+h.port_check.join(',');
  return c;
}

async function loadHosts(){
  const r = await fetch('/api/hosts',{cache:'no-store'});
  const list = await r.json();
  document.getElementById('hostCount').textContent = list.length;
  const box = document.getElementById('hostList');
  if(!list.length){ box.innerHTML = '<div class="muted">暂无服务器。点「+ 添加服务器」新增。</div>'; return; }
  box.innerHTML = list.map(h=>{
    const cmd = agentCmd(h);
    return '<div class="hitem">'
      + '<div class="hn"><b>'+esc(h.name)+'</b>'
      + (h.panel?'<span class="tag">面板</span>':'<span class="tag">仅资源</span>')
      + '<button class="btn ghost" onclick="editHost(\''+esc(h.name)+'\')">编辑</button>'
      + '<button class="btn danger" onclick="delHost(\''+esc(h.name)+'\')">删除</button></div>'
      + '<div class="ha">'+esc(cmd)+'<button class="copy" onclick="copyText(this)">复制</button></div>'
      + '</div>';
  }).join('');
}

function copyText(btn){
  const txt = btn.parentElement.textContent.replace('复制','').trim();
  navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='已复制'; setTimeout(()=>btn.textContent=o,1200); });
}

function openAdd(){
  document.getElementById('formTitle').textContent = '添加服务器';
  ['f_name','f_manage','f_purl','f_puser','f_ppass','f_ports','f_quota'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_puser').value='admin';
  document.getElementById('formOv').dataset.edit='';
  document.getElementById('formOv').classList.add('show');
}
async function editHost(name){
  const r = await fetch('/api/hosts',{cache:'no-store'});
  const list = await r.json();
  const h = list.find(x=>x.name===name);
  if(!h) return;
  document.getElementById('formTitle').textContent = '编辑服务器 · '+name;
  document.getElementById('f_name').value = h.name;
  document.getElementById('f_manage').value = h.manage_url||'';
  document.getElementById('f_purl').value = h.panel?h.panel.url:'';
  document.getElementById('f_puser').value = h.panel?h.panel.username:'admin';
  document.getElementById('f_ppass').value = h.panel?h.panel.password:'';
  document.getElementById('f_ports').value = (h.port_check||[]).join(',');
  document.getElementById('f_quota').value = h.quota>0?h.quota:'';
  document.getElementById('formOv').dataset.edit = name;
  document.getElementById('formOv').classList.add('show');
}
async function saveHost(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('名称不能为空'); return; }
  const purl = document.getElementById('f_purl').value.trim();
  const body = {
    name,
    manage_url: document.getElementById('f_manage').value.trim(),
    panel: purl ? { url: purl, username: document.getElementById('f_puser').value.trim()||'admin', password: document.getElementById('f_ppass').value } : null,
    port_check: document.getElementById('f_ports').value.split(',').map(s=>s.trim()).filter(Boolean),
    quota: parseInt(document.getElementById('f_quota').value)||0
  };
  const r = await fetch('/api/hosts?key='+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok){ alert('保存失败：'+(j.error||r.status)); return; }
  document.getElementById('formOv').classList.remove('show');
  await loadHosts();
}
async function delHost(name){
  if(!confirm('确定删除「'+name+'」？该 VPS 的卡片将从面板移除（已安装的 agent 仍可运行，只是不再显示）。')) return;
  const r = await fetch('/api/hosts/'+encodeURIComponent(name)+'?key='+encodeURIComponent(KEY),{method:'DELETE'});
  const j = await r.json();
  if(!j.ok){ alert('删除失败：'+(j.error||r.status)); return; }
  await loadHosts();
}

document.getElementById('btnAdd').onclick = openAdd;
document.getElementById('btnManage').onclick = async ()=>{ await loadHosts(); document.getElementById('listOv').classList.add('show'); };
document.getElementById('btnCancel').onclick = ()=>document.getElementById('formOv').classList.remove('show');
document.getElementById('btnSave').onclick = saveHost;
document.getElementById('btnCloseList').onclick = ()=>document.getElementById('listOv').classList.remove('show');
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }));

tick();
setInterval(tick, REFRESH);
</script>
</body>
</html>
